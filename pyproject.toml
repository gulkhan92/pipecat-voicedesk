[project]
name = "pipecat-voicedesk"
version = "0.1.0"
description = "Real-time voice agent for e-commerce customer support, built on Pipecat"
readme = "README.md"
authors = [
    { name = "gulkhan92", email = "gulhameed.lums@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "pipecat-ai[groq,kokoro,runner,silero,websocket,whisper]>=1.11.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=3",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "voicedesk_retrieval"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
